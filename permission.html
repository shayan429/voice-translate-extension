<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Allow microphone — Voice Translate</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7f7fb;
      color: #1f2133;
      display: flex;
      justify-content: center;
    }
    .card {
      max-width: 420px;
      background: white;
      border: 1px solid #eaeaf2;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { font-size: 13.5px; line-height: 1.5; color: #44475c; }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 14px; font-size: 13px; font-weight: 600; min-height: 18px; }
    .ok { color: #1a7f37; }
    .err { color: #c0292e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎤 Allow microphone access</h1>
    <p>
      Chrome can't show the "Allow microphone" prompt inside the side panel, so
      it has to happen here, in a normal tab, once. After you click Allow below,
      you can close this tab and go back to the Voice Translate side panel —
      the mic button will work from there.
    </p>
    <button id="grantBtn">Allow microphone</button>
    <div id="status"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
